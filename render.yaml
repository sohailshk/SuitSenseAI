services:
  - type: web
    name: suitsense-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PG_USER
        sync: false
      - key: PG_PASSWORD
        sync: false
      - key: PG_PORT
        sync: false
      - key: PG_DB
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GPLACES_API_KEY
        sync: false
      - key: GPLACE_API_KEY
        sync: false
      - key: FLASK_SECRET
        generateValue: true
